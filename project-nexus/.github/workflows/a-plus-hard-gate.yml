name: A+ Hard Gate — Slide 15

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  slide-15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Slide 15 orchestrator
        run: python3 build/arc_orchestrator.py --slides 15
      - name: Run Spirits Within benchmark
        run: python3 build/arc_orchestrator.py --benchmark spirits_within
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slide-15-audit
          path: audit_reports/
