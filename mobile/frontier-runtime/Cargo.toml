[package]
name = "frontier-mobile-runtime"
version = "0.1.0"
edition = "2021"
description = "Native mobile runtime for Lighthouse-generated Frontier apps"
license = "MIT"

[lib]
name = "frontier_app"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
ai = []
network = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "=2.9.7", default-features = false, features = ["tls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
